<!doctype html>
<!-- Generated by build.mjs. Edit the templates and translations in source/. -->
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ef">
  <meta name="description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <title>{{title}}</title>
  <link rel="icon" type="image/webp" href="{{base}}assets/meowly-icon.webp">
  <link rel="stylesheet" href="{{base}}styles.css">
{{{script}}}
</head>
<body id="top">
  <a class="skip-link" href="#main">{{skip}}</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{homeUrl}}" aria-label="{{brandLabel}}">
      <img src="{{base}}assets/meowly-icon.webp" alt="" width="40" height="40">
      <span>Meowly<span class="wordmark-dot">.</span></span>
    </a>
    <nav class="site-nav" aria-label="{{navigation}}">
      <a href="{{sectionBase}}#features">{{features}}</a>
      <a href="{{sectionBase}}#sounds">{{sounds}}</a>
    </nav>
    <div class="header-actions">
{{{iphoneLink}}}
      <nav class="locale-nav" aria-label="{{languages}}">
        {{{languageLinks}}}
      </nav>
    </div>
  </header>

{{{content}}}

  <footer class="site-footer wrap">
    <a class="wordmark" href="{{homeUrl}}" aria-label="{{brandLabel}}">Meowly<span class="wordmark-dot">.</span></a>
    <div class="footer-links">
      <a href="privacy.html"{{{privacyCurrent}}}>{{privacy}}</a>
      <a href="#top">{{backToTop}}</a>
    </div>
  </footer>
</body>
</html>
